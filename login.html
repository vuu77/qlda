<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống quản lý dự án</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="card auth-card">
      <h2>Quản lý dự án CNTT</h2>
      <p class="muted">Đăng nhập hoặc tạo tài khoản để quản lý dự án theo mã dự án.</p>
      <div class="tabs">
        <div id="loginTab" class="tab active">Đăng nhập</div>
        <div id="registerTab" class="tab">Đăng ký</div>
      </div>
      <div id="authMsg" class="notice hidden"></div>

      <div id="loginBox">
        <form id="loginForm">
          <label>Email</label>
          <input id="loginEmail" type="email" required>
          <label>Mật khẩu</label>
          <input id="loginPassword" type="password" required>
          <div class="actions"><button class="btn" type="submit">Đăng nhập</button></div>
        </form>
        <p class="muted">Tài khoản mẫu: <strong>admin@project.local</strong> / <strong>123456</strong></p>
      </div>

      <div id="registerBox" class="hidden">
        <form id="registerForm">
          <label>Họ và tên</label>
          <input id="regName" required>
          <label>Email</label>
          <input id="regEmail" type="email" required>
          <label>Mật khẩu</label>
          <input id="regPassword" type="password" required>
          <label>Vai trò</label>
          <select id="regRole">
            <option value="member">Thành viên</option>
            <option value="manager">Trưởng dự án</option>
          </select>
          <div class="actions"><button class="btn" type="submit">Tạo tài khoản</button></div>
        </form>
      </div>
    </div>
  </div>
  <script src="assets/scripts/app.js"></script>
</body>
</html>
